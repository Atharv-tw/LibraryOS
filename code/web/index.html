<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Book Management System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233056d3'/><path d='M9 8h4v16H9zM15 8h4v16h-4zM21.5 9l3.6-1 3.4 15.6-3.6 1z' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32"><path d="M7 7h4.5v18H7zM13.5 7H18v18h-4.5zM20.6 8.2l4.1-1.1 3.9 17.6-4.1 1.1z"/></svg>
      </div>
      <div>
        <div class="brand-name">LibraryOS</div>
        <div class="brand-sub">Book Management System</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-page="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Dashboard</a>
      <a href="#search" data-page="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.4l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Search Catalogue</a>
      <a href="#issue" data-page="issue"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4zm13-6 4 2-4 2z"/></svg>Issue Desk <span class="pill" id="nav-queue"></span></a>
      <a href="#returns" data-page="returns"><svg viewBox="0 0 24 24"><path d="M5 4h14v3H5zm1 5h12v3H6zm-1 5h14v3H5zm2 5h10v2H7z"/></svg>Returns Desk <span class="pill amber" id="nav-stack"></span></a>
      <a href="#members" data-page="members"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0h-1a4.2 4.2 0 0 1 2 3.5V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>Members</a>
      <a href="#reports" data-page="reports"><svg viewBox="0 0 24 24"><path d="M5 9h3v11H5zm5.5-5h3v16h-3zM16 13h3v7h-3z"/></svg>Reports</a>
      <a href="#lab" data-page="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6v2h-1v4.6l5.4 9.1A2 2 0 0 1 17.7 21H6.3a2 2 0 0 1-1.7-3.3L10 9.6V5H9zm3 9.2L8.4 18h7.2z"/></svg>Algorithm Lab</a>
      <a href="#log" data-page="log"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2 4.9l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>Activity Log</a>
    </nav>
    <div class="sidebar-foot">
      <div class="ds-legend">
        <span><i class="dot blue"></i>Queue · FIFO</span>
        <span><i class="dot amber"></i>Stack · LIFO</span>
        <span><i class="dot green"></i>Binary search</span>
      </div>
      <div class="team">DAA Mini Project · CIC-311<br>T3 · Group 14</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub" class="muted"></p>
      </div>
      <div class="top-actions">
        <label class="clock" title="Every action is time-stamped on this date. Move it forward to see late returns and fines.">
          <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v11H5z"/></svg>
          <span>Library date</span>
          <input type="date" id="clock-date">
        </label>
        <div class="menu">
          <button class="btn ghost" id="menu-btn">Data ▾</button>
          <div class="menu-list" id="menu-list">
            <button data-admin="save">Save to CSV</button>
            <button data-admin="reload">Reload saved data</button>
            <button data-admin="demo">Reset demo scenario</button>
            <button data-admin="fresh">Fresh sample library</button>
          </div>
        </div>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <div id="toasts"></div>
  <script src="app.js?v=2"></script>
</body>
</html>
